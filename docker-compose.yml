services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civiclense
    ports: ["54322:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    env_file: ./server/.env
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./client
    env_file: ./client/.env
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  dbdata:
